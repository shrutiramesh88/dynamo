tensor_parallel_size: 8
pipeline_parallel_size: 1
moe_expert_parallel_size: 8
enable_attention_dp: false

max_num_seqs: 64
max_num_tokens: 4096 #32768 
max_seq_len: 2048 #8192 best for 2k-2k and 4k-2k  #4096 best for 1k-2k

trust_remote_code: true
backend: pytorch
enable_chunked_prefill: true #false enable this for higher throughpu
# Overlap scheduler not currently supported in prefill only workers.
disable_overlap_scheduler: true

cuda_graph_config:

  # FIXED: Lowered the max batch size for chunk computation.
  max_batch_size: 32 #64
  enable_padding: true
  batch_sizes: [16, 32] 

kv_transfer_config:
  kv_connector: "NixlConnector"
  kv_role: "kv_producer"

kv_cache_config:
  free_gpu_memory_fraction: 0.15 #0.30 - was still too high, caused OOM during NVFP4 weight conversion
  dtype: fp8 #nvfp4 #fp8

cache_transceiver_config:
  backend: DEFAULT # Crucial: This transmits the KV Cache over to Node 2
