tensor_parallel_size: 8
pipeline_parallel_size: 1
moe_expert_parallel_size: 8
enable_attention_dp: false

max_num_seqs: 64
max_seq_len: 4096 #8192 best for 2k-2k and 4k-2k #4096 best for 1k-2k
# OPTIMIZED: Adjusted to a healthy scheduler ceiling for a 512-wide token decode step
max_num_tokens: 512 #8192


trust_remote_code: true
backend: pytorch
# Overlap scheduler not currently supported in prefill only workers.
disable_overlap_scheduler: true

cuda_graph_config:
  enable_padding: true
  max_batch_size: 32 #256 #512
  batch_sizes: [1, 2, 4, 8, 16, 32] #[32, 64, 128, 192, 256] #, 320, 384, 448, 512]

kv_transfer_config:
  kv_connector: "NixlConnector"
  kv_role: "kv_consumer"

kv_cache_config:
  free_gpu_memory_fraction: 0.10 #0.20 - reduced further to avoid OOM during NVFP4 conversion
  dtype: fp8 #nvfp4

cache_transceiver_config:
  backend: DEFAULT

